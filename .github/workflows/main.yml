name: Generate RouterOS China IP List

on:
  schedule:
    # 每天北京时间凌晨 4:00 自动运行 (UTC 时间 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch APNIC data and generate ROS script
      run: |
        echo "正在从 APNIC 官方 HTTPS 源获取最新的 IP 数据..."
        curl -s -L -f https://ftp.apnic.net/stats/apnic/delegated-apnic-latest > apnic.txt
        
        echo "开始解析并生成特定格式的 RouterOS 脚本..."
        
        # 1. 初始化头部内容（打印日志，并清空旧的 CN 列表）
        echo '/log info "Loading CN ipv4 address list"' > china_ip.rsc
        echo '/ip firewall address-list remove [/ip firewall address-list find list=CN]' >> china_ip.rsc
        echo '/ip firewall address-list' >> china_ip.rsc
        
        # 2. 过滤出中国大陆的 IPv4 地址，计算掩码，并严格按照 :do { add address=... list=CN } on-error={} 格式输出
        awk -F'|' '/apnic\|CN\|ipv4/ {
            ip = $4;
            count = $5;
            mask = 32 - log(count)/log(2);
            printf ":do { add address=%s/%d list=CN } on-error={}\n", ip, mask
        }' apnic.txt >> china_ip.rsc
        
        # 清理临时文件
        rm apnic.txt
        echo "ROS 脚本生成完毕！"

    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add china_ip.rsc
        git diff-index --quiet HEAD || git commit -m "自动更新中国 IP 列表 (指定格式容错版)"
        git push
