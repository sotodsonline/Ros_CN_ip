name: Generate RouterOS China IP List

on:
  schedule:
    # 每天北京时间凌晨 4:00 自动运行 (UTC 时间 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch APNIC data and generate ROS script
      run: |
        echo "正在从 APNIC 官方 HTTPS 源获取最新的 IP 数据..."
        # 【修改这里】改用官方的 HTTPS 镜像源，并增加 -L（追踪重定向）和 -f（失败时报错）参数
        curl -s -L -f https://ftp.apnic.net/stats/apnic/delegated-apnic-latest > apnic.txt
        
        echo "开始解析并生成 RouterOS 脚本..."
        # 初始化 .rsc 文件头部内容
        echo "/ip firewall address-list remove [/ip firewall address-list find list=CN]" > china_ip.rsc
        echo "/ip firewall address-list" >> china_ip.rsc
        
        # 过滤出中国大陆的 IPv4 地址并转换为标准的 ROS 命令行格式
        awk -F'|' '/apnic\|CN\|ipv4/ {
            ip = $4;
            count = $5;
            mask = 32 - log(count)/log(2);
            printf "add list=CN address=%s/%d\n", ip, mask
        }' apnic.txt >> china_ip.rsc
        
        # 清理临时文件
        rm apnic.txt
        echo "ROS 脚本生成完毕！"

    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add china_ip.rsc
        git diff-index --quiet HEAD || git commit -m "自动更新中国 IP 列表 (基于 APNIC 官方数据)"
        git push
